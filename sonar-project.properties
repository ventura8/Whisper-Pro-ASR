# SonarQube Cloud analysis configuration.
#
# organization / projectKey are assigned by SonarQube Cloud when the repository is
# imported. The values below follow Cloud's default derivation from the GitHub
# remote (ventura8/Whisper-Pro-ASR); if the imported project shows different keys,
# these two lines are the only ones that need to change.
sonar.organization=ventura8
sonar.projectKey=ventura8_Whisper-Pro-ASR
sonar.projectName=Whisper Pro ASR
sonar.projectVersion=1.4.0

sonar.sources=modules,static,scripts,whisper_pro_asr.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12,3.13

# Coverage reports are produced by tests/run_suite.sh (python-tests / js-unit-tests
# stages) and consumed here. Paths are relative to this file.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest.xml
sonar.javascript.lcov.reportPaths=coverage-js/lcov.info

# Third-party source and generated artifacts. .fixture-tooling, model_cache and
# test_data are gitignored local caches of upstream code and generated audio; they
# do not exist on a runner but do exist on a developer machine that has run the
# fixture generator, so a local scan would otherwise report upstream's code.
sonar.exclusions=\
  node_modules/**,\
  .fixture-tooling/**,\
  model_cache/**,\
  test_data/**,\
  coverage-js/**,\
  reports/**,\
  assets/**,\
  requirements/*.lock.txt,\
  **/__pycache__/**

# Duplication in tests is largely intentional (parametrized fixture matrices and
# per-engine variants that read better spelled out than factored together).
sonar.cpd.exclusions=tests/**
