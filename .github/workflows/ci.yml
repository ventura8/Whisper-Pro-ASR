name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/*
      - release/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build & Cache Test Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce Up-to-date Poetry Lock File
        env:
          PIP_VERSION: "26.2.1"
          POETRY_VERSION: "2.4.1"
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD/pyproject.toml:/workspace/pyproject.toml" \
            -v "$PWD/poetry.lock:/workspace/poetry.lock" \
            -w /workspace \
            python:3.12-slim \
            /bin/bash -lc "
              export HOME=/tmp
              export PATH=\"/tmp/.local/bin:\$PATH\"
              export PIP_ROOT_USER_ACTION=ignore
              export PIP_NO_WARN_SCRIPT_LOCATION=1
              python -m pip install --quiet --user --upgrade \"pip==${PIP_VERSION}\"
              python -m pip install --quiet --user \"poetry==${POETRY_VERSION}\"
              python -m poetry config virtualenvs.create false
              if [ ! -f poetry.lock ] || ! python -m poetry check --lock; then
                echo \"poetry.lock is missing or out of sync. Please run poetry lock locally and commit the changes.\"
                exit 1
              fi
            "

      - name: Free Disk Space (Ubuntu)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/julia* \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /var/cache/apt/* \
            /var/lib/apt/lists/*
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          docker builder prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build & Push Test Image Cache (GHA)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: false
          cache-from: type=gha,scope=whisper-pro-asr-test
          cache-to: type=gha,mode=max,scope=whisper-pro-asr-test

  build-targets:
    name: Validate ${{ matrix.target }} Target
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, intel, intel-xpu, nvidia, nvidia-whisperx, full, nvidia-intel, amd, amd-rocm-torch]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          docker system prune -af --volumes || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Resolve Base Image For Target
        id: base
        env:
          OPENVINO_BASE: >-
            openvino/ubuntu24_runtime:2026.3.1@sha256:fdfa0f1c42f69b4cbf010999482a32279ac04a07b2fb53f449e67246dcb5f1df
          UBUNTU_BASE: >-
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
        run: |
          # Only Intel-bearing targets need the OpenVINO runtime base.
          case "${{ matrix.target }}" in
            intel|intel-xpu|nvidia-intel|full) echo "image=$OPENVINO_BASE" >> "$GITHUB_OUTPUT" ;;
            *)                       echo "image=$UBUNTU_BASE"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build ${{ matrix.target }} Target (Validation)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: false
          build-args: |
            RUNTIME_BASE=${{ steps.base.outputs.image }}
          cache-from: type=gha,scope=whisper-pro-asr-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=whisper-pro-asr-${{ matrix.target }}

  lint-and-security:
    name: Lint & Security
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Load Test Image (cache-hit rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: true
          tags: whisper-pro-asr-test
          cache-from: type=gha,scope=whisper-pro-asr-test

      - name: Run Lint & Security Stage
        run: |
          mkdir -p reports
          chmod 0777 reports
          docker run --rm \
            -e CI=true \
            -e PIPELINE_STAGE=lint \
            -v "$PWD/reports:/reports" \
            -v whisper-pro-asr-tool-cache:/var/cache/whisper-pro-asr-tools \
            whisper-pro-asr-test /bin/bash -c "tests/run_suite.sh"

      - name: Export Complexity Summary
        if: success() || failure()
        run: |
          {
            echo "### Cyclomatic Complexity Summary"
            echo '```text'
            if [ -f reports/complexity_output.txt ]; then
              cat reports/complexity_output.txt
            else
              echo "reports/complexity_output.txt not found"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  python-tests:
    name: Python Tests & Coverage
    needs: [build-image, lint-and-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Load Test Image (cache-hit rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: true
          tags: whisper-pro-asr-test
          cache-from: type=gha,scope=whisper-pro-asr-test

      - name: Run Python Tests Stage
        run: |
          mkdir -p assets reports
          chmod 0777 assets reports
          docker run --rm \
            -e CI=true \
            -e PIPELINE_STAGE=python-tests \
            -v "$PWD/assets:/app/assets" \
            -v "$PWD/reports:/reports" \
            -v whisper-pro-asr-tool-cache:/var/cache/whisper-pro-asr-tools \
            whisper-pro-asr-test /bin/bash -c "tests/run_suite.sh; TEST_EXIT_CODE=\$?; \
              [ -f coverage.xml ] && cp coverage.xml /reports/coverage.xml || true; \
              [ -f coverage_output.txt ] && cp coverage_output.txt /reports/coverage_output.txt || true; \
              [ -f complexity_output.txt ] && cp complexity_output.txt /reports/complexity_output.txt || true; \
              [ -f pytest.xml ] && cp pytest.xml /reports/pytest.xml || true; \
              exit \$TEST_EXIT_CODE"

      - name: Export Coverage Summary
        if: success() || failure()
        run: |
          {
            echo "### Code Coverage Summary"
            echo '```text'
            if [ -f reports/coverage_output.txt ]; then
              # Extract coverage report summary
              if grep -qE '^[-_]+ coverage:' reports/coverage_output.txt; then
                sed -n -E '/^[-_]+ coverage:/,/^TOTAL/p' \
                  reports/coverage_output.txt
              else
                # Fallback: show last 30 lines containing coverage data
                tail -30 reports/coverage_output.txt | grep -E \
                  '(py$|TOTAL|^-+$)' || tail -30 \
                  reports/coverage_output.txt
              fi
            else
              echo "reports/coverage_output.txt not found"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate PR Coverage Comment
        # Only on pull_request: the action posts a PR comment (pull-requests: write).
        # On push it tries a commit comment, which needs contents: write and is not
        # useful for our PR-centric review flow -- skip it so push CI stays green.
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@d46d9d594f3e1d11008ed19939deb7a139b18751  # v1.11.1
        with:
          pytest-coverage-path: ./reports/coverage_output.txt
          junitxml-path: ./reports/pytest.xml

  js-unit-tests:
    name: JS Unit Tests
    needs: [build-image, lint-and-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Load Test Image (cache-hit rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: true
          tags: whisper-pro-asr-test
          cache-from: type=gha,scope=whisper-pro-asr-test

      - name: Run JS Unit Tests Stage
        run: |
          docker run --rm \
            -e CI=true \
            -e PIPELINE_STAGE=js-unit-tests \
            -v whisper-pro-asr-tool-cache:/var/cache/whisper-pro-asr-tools \
            whisper-pro-asr-test /bin/bash -c "tests/run_suite.sh"

  e2e-fixture:
    name: E2E (Fixture Backend)
    needs: [build-image, lint-and-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Load Test Image (cache-hit rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: true
          tags: whisper-pro-asr-test
          cache-from: type=gha,scope=whisper-pro-asr-test

      - name: Run E2E (Fixture Backend) Stage
        run: |
          docker run --rm \
            -e CI=true \
            -e PIPELINE_STAGE=e2e-fixture \
            -v whisper-pro-asr-tool-cache:/var/cache/whisper-pro-asr-tools \
            whisper-pro-asr-test /bin/bash -c "tests/run_suite.sh"

  e2e-real:
    name: E2E (Real Backend)
    needs: [build-image, lint-and-security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Load Test Image (cache-hit rebuild)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.test
          target: test
          load: true
          tags: whisper-pro-asr-test
          cache-from: type=gha,scope=whisper-pro-asr-test

      - name: Run E2E (Real Backend) Stage
        run: |
          docker run --rm \
            -e CI=true \
            -e PIPELINE_STAGE=e2e-real \
            -v whisper-pro-asr-tool-cache:/var/cache/whisper-pro-asr-tools \
            whisper-pro-asr-test /bin/bash -c "tests/run_suite.sh"

  release-description-validation:
    name: Validate Release Metadata
    needs:
      - build-image
      - lint-and-security
      - python-tests
      - js-unit-tests
      - e2e-fixture
      - e2e-real
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_name: ${{ steps.release.outputs.release_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Verify GitHub Release Description Exists
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG_NAME" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Error: tag '$TAG_NAME' does not match the expected 'vMAJOR.MINOR.PATCH' format."
            exit 1
          fi
          notes_path="docs/releases/${TAG_NAME}_github_description.md"
          if [ ! -f "$notes_path" ]; then
            echo "Error: GitHub release description '$notes_path' is missing. Add it before tagging a release."
            exit 1
          fi
          release_name=$(sed -n 's/^#[[:space:]]\{1,\}//p' "$notes_path" | head -n 1)
          if [ -z "$release_name" ]; then
            echo "Error: '$notes_path' has no H1 heading to use as the GitHub Release title."
            exit 1
          fi
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

          expected_version="${TAG_NAME#v}"
          pyproject_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['tool']['poetry']['version'])")
          package_version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          config_version=$(grep -m1 '^VERSION = ' modules/core/config.py | sed -E 's/^VERSION = "([^"]+)"$/\1/')
          version_sources=(
            "pyproject.toml:$pyproject_version"
            "package.json:$package_version"
            "modules/core/config.py:$config_version"
          )
          for source_pair in "${version_sources[@]}"; do
            source_label="${source_pair%%:*}"
            source_value="${source_pair#*:}"
            if [ -z "$source_value" ] || [ "$source_value" != "$expected_version" ]; then
              echo "Error: tag '$expected_version' vs $source_label '${source_value:-<not found>}'."
              exit 1
            fi
          done

  publish-images:
    name: Push ${{ matrix.target }} Image
    needs:
      - build-image
      - build-targets
      - lint-and-security
      - python-tests
      - js-unit-tests
      - e2e-fixture
      - e2e-real
      - release-description-validation
    if: >
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cpu, intel, intel-xpu, nvidia, nvidia-whisperx, full, nvidia-intel, amd, amd-rocm-torch]
    permissions:
      contents: read
    env:
      # Moving per-target tags (e.g. ":nvidia") only advance on main or a release tag.
      PUBLISH_MOVING_TAG: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost || true
          docker system prune -af --volumes || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `full` claims the unsuffixed tags (latest / {{version}}), so a bare
      # `docker pull ventura8/whisper-pro-asr` resolves to an image that runs on whatever
      # hardware the host turns out to have: every vendor's ONNX Runtime (CPU, NVIDIA,
      # Intel, AMD) plus WhisperX for diarization.
      #
      # This reverses an earlier decision that gave the tag to `nvidia-whisperx`, on the
      # grounds that a `latest` puller on an NVIDIA box never uses the Intel and ROCm
      # stacks. That cost is real -- `full` is ~21.1GB against ~18.4GB -- and it is
      # accepted deliberately: `latest` should work on an unknown host rather than be the
      # smallest image for the most likely one. Anyone who knows their hardware, or who
      # cares about the 2.7GB, picks a specific target from the README's image table;
      # `nvidia-whisperx` is still built and published under its own tag.
      - name: Resolve Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ventura8/whisper-pro-asr
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.target }}
            type=semver,pattern={{version}}-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ env.PUBLISH_MOVING_TAG }}
            type=semver,pattern={{version}},enable=${{ matrix.target == 'full' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.target == 'full' }}
            type=sha,format=long,enable=${{ matrix.target == 'full' }}
            type=raw,value=latest,enable=${{ matrix.target == 'full' && github.ref == 'refs/heads/main' }}

      - name: Resolve Base Image For Target
        id: base
        env:
          OPENVINO_BASE: >-
            openvino/ubuntu24_runtime:2026.3.1@sha256:fdfa0f1c42f69b4cbf010999482a32279ac04a07b2fb53f449e67246dcb5f1df
          UBUNTU_BASE: >-
            ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
        run: |
          # Only Intel-bearing targets need the OpenVINO runtime base.
          case "${{ matrix.target }}" in
            intel|intel-xpu|nvidia-intel|full) echo "image=$OPENVINO_BASE" >> "$GITHUB_OUTPUT" ;;
            *)                       echo "image=$UBUNTU_BASE"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Finalize & Push ${{ matrix.target }} Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            RUNTIME_BASE=${{ steps.base.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=whisper-pro-asr-${{ matrix.target }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish & Release
    needs:
      - build-image
      - lint-and-security
      - python-tests
      - js-unit-tests
      - e2e-fixture
      - e2e-real
      - release-description-validation
      # The GitHub Release and the Docker Hub description must not go out ahead of the
      # images they describe: a release announcing tags that are still being pushed sends
      # every early puller to a manifest that does not exist yet. On refs where
      # publish-images is skipped by its own `if`, this dependency is satisfied as skipped
      # rather than blocking, so branch builds are unaffected.
      - publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/vcpkg \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/julia* \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /opt/hostedtoolcache \
            /opt/microsoft/powershell \
            /var/cache/apt/* \
            /var/lib/apt/lists/*
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          docker builder prune -af || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Authenticate to DockerHub
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.release-description-validation.outputs.release_name }}
          # Use the curated docs/releases/vX.Y.Z_github_description.md body -- do not
          # substitute auto-generated notes.
          RELEASE_NOTES_PATH: docs/releases/${{ github.ref_name }}_github_description.md
        run: |
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${RELEASE_NOTES_PATH}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${RELEASE_NAME}" \
              --notes-file "${RELEASE_NOTES_PATH}"
          fi

      - name: Update Docker Hub Description
        if: >
          github.ref == 'refs/heads/main' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ventura8/whisper-pro-asr
          readme-filepath: ./docs/DOCKERHUB_DESCRIPTION.md
