[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
cache_dir = /var/cache/whisper-pro-asr-tools/pytest
addopts = --cov=. --cov-report=term-missing --cov-report=xml
markers =
    real_asr: drives a live service over HTTP; requires RUN_REAL_ASR=1.
    real_audio: uses generated or committed audio-matrix fixtures.
    gpu: requires a real GPU (nvidia-smi) on the host; never runs in CI.
    slow: multi-minute wall clock; excluded from the default CI test stage.
    smoke: representative fast subset of the real-audio matrix (target: under 20 minutes).
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\.:DeprecationWarning
