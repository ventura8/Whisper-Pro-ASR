---
services:
  init-permissions:
    image: busybox:1.37
    user: "0:0"
    volumes:
      - ./data:/app/data
      - ./model_cache:/app/model_cache
    environment:
      U: ${USER_ID:-1000}
      G: ${GROUP_ID:-1000}
    # Exec-array form avoids Portainer/Compose UI failures on multiline shell quoting.
    command:
      - sh
      - -c
      - |
        case "$$U" in (''|*[!0-9]*) exit 1;; esac
        case "$$G" in (''|*[!0-9]*) exit 1;; esac
        # Kernel/JIT caches are redirected here (see XDG_CACHE_HOME and friends below).
        # Create them up front: a driver that cannot write its cache directory falls back
        # to recompiling silently, with no error and a 50x slower first request.
        mkdir -p /app/model_cache/kernel_cache/xdg /app/model_cache/kernel_cache/sycl \
                 /app/model_cache/kernel_cache/neo /app/model_cache/kernel_cache/cuda \
                 /app/model_cache/kernel_cache/triton /app/model_cache/kernel_cache/numba
        find /app/data /app/model_cache \( ! -user "$$U" -o ! -group "$$G" \) -exec chown "$$U:$$G" {} +
    restart: "no"

  whisper-pro-asr:
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
      # Hardware target. Models are downloaded at startup, not baked in.
      #   cpu (~4.9GB) | intel (~5.2GB) | intel-xpu (~11.2GB) | nvidia (~17.5GB)
      #   nvidia-intel (~17.9GB) | nvidia-whisperx (~18.4GB) | amd (~14.1GB)
      #   amd-rocm-torch (~21.8GB) | full (~29.8GB locally, adds WhisperX diarization)
      #
      # intel, intel-xpu, nvidia-intel and full need /opt/intel/openvino, which the default
      # RUNTIME_BASE below does NOT provide -- the base file deliberately defaults to Ubuntu
      # for CPU compatibility. Merge the matching docker-compose.<target>.yml (each
      # Intel-bearing override restores the pinned OpenVINO base), or pass a RUNTIME_BASE
      # that carries it. Building one of those targets on the bare base file loses the
      # bundled Level Zero runtime and then fails installing Ubuntu packages that do not exist.
      target: ${BUILD_TARGET:-cpu}
      args:
        RUNTIME_BASE: ${RUNTIME_BASE:-ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517}
      # Persist BuildKit cache across docker compose builds (especially useful on Windows/WSL2).
      #
      # mode=min, not max. mode=max exports every intermediate layer of every stage, and
      # this Dockerfile has many: on a validation host it reached 95GB and filled the root
      # filesystem to zero bytes, after which the build failed with "no space left on
      # device" while still leaving a plausible-looking image behind. mode=min exports only
      # the layers of the final image, which is what a rebuild actually reuses.
      #
      # BUILDX_CACHE_DIR moves the cache off a small root filesystem; BUILDX_CACHE_MODE=max
      # restores the old behaviour where the disk can afford it.
      cache_from:
        - type=local,src=${BUILDX_CACHE_DIR:-.buildx-cache}
      cache_to:
        - type=local,dest=${BUILDX_CACHE_DIR:-.buildx-cache},mode=${BUILDX_CACHE_MODE:-min}
    image: whisper-pro-asr:${BUILD_TARGET:-cpu}
    container_name: whisper-pro-asr
    restart: unless-stopped
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/ | grep -q 'healthy'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    # --- [HARDWARE ACCELERATION] ---
    # Device passthrough lives in the per-target override files, because it differs by
    # vendor and a CPU-only host must not be forced to have nvidia-container-toolkit:
    #
    #   docker compose -f docker-compose.yml -f docker-compose.cpu.yml          up -d
    #   docker compose -f docker-compose.yml -f docker-compose.intel.yml        up -d
    #   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml       up -d
    #   docker compose -f docker-compose.yml -f docker-compose.amd.yml          up -d
    #   docker compose -f docker-compose.yml -f docker-compose.nvidia-intel.yml up -d
    #
    # Set BUILD_TARGET in .env to the matching target. WSL2 hosts also merge
    # docker-compose.wsl.yml.

    environment:
      - TZ=${TZ:-UTC}
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      - DEBUG=false

      # --- [NVIDIA RUNTIME HINTS] ---
      # Safe on non-NVIDIA hosts; utilized when NVIDIA Container Toolkit is active.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

      # --- [INTEL / OPENVINO RUNTIME HINTS] ---
      # Optional overrides. Leave blank for automated detection.
      - LIBVA_DRIVER_NAME=${LIBVA_DRIVER_NAME:-}
      # Passed through only when the host actually sets it. Assigning an empty value here
      # is not neutral: Intel's SYCL runtime (used by the XPU torch build in the
      # intel-xpu image) rejects an empty ONEAPI_DEVICE_SELECTOR with an uncaught C++
      # exception, which aborts the process -- the service crash-looped on SIGSEGV until
      # this stopped being set to "".
      - ONEAPI_DEVICE_SELECTOR
      - ZE_AFFINITY_MASK=${ZE_AFFINITY_MASK:-}
      - OCL_ICD_VENDORS=${OCL_ICD_VENDORS:-}

      # --- [AMD ROCM / WSL2 RUNTIME HINTS] ---
      - HSA_ENABLE_DXG_DETECTION=1
      # Optional: For AMD RDNA/ROCm APU systems, set override if required:
      # - HSA_OVERRIDE_GFX_VERSION=10.3.0

      # Speaker diarization token (Hugging Face). Required for PyAnnote speaker segmentation.
      - DIARIZATION_HF_TOKEN=${DIARIZATION_HF_TOKEN:-}

      # --- [ENGINE CONFIGURATION] ---
      # Hardware Target: AUTO (Resolves CUDA -> AMD -> Intel GPU -> Intel NPU -> CPU),
      # or explicit: CPU, CUDA, GPU, NPU, AMD
      - ASR_DEVICE=${ASR_DEVICE:-AUTO}
      # Computation Precision: AUTO, int8, float16 (default: AUTO)
      - ASR_COMPUTE_TYPE=AUTO
      # Model Weight Source (Faster-Whisper ID or local path)
      - ASR_MODEL=Systran/faster-whisper-large-v3
      # ASR engine backend: AUTO, FASTER-WHISPER, INTEL-WHISPER, OPENAI-WHISPER, WHISPERX
      # AUTO resolves to FASTER-WHISPER on every host, whatever accelerators are present.
      # For accelerated ASR on Intel set INTEL-WHISPER; on AMD set OPENAI-WHISPER with the
      # amd-rocm-torch image. CTranslate2 has no OpenVINO or ROCm backend, so AUTO decodes
      # on the CPU there and the startup banner says so.
      - ASR_ENGINE=${ASR_ENGINE:-AUTO}
      # Off by default. On a host with BOTH a CUDA/AMD GPU and an Intel GPU/NPU, "true"
      # runs each unit's native engine in its own worker so both accelerators stay busy.
      # Opt-in because it makes the engine depend on which unit serves a request.
      - HYBRID_ENGINES=${HYBRID_ENGINES:-false}
      # Intel Whisper long-media stability tuning (only used by INTEL-WHISPER)
      - INTEL_ASR_CHUNK_DURATION=300

      # --- [SUBTITLE PROMO CARD] ---
      # Enable a promo subtitle card "Made with Whisper Pro ASR" for the first 3 seconds of SRT/VTT.
      - SUBTITLE_PROMO_ENABLED=true
      - SUBTITLE_PROMO_TEXT=Made with Whisper Pro ASR
      - SUBTITLE_PROMO_DURATION=3.0

      # --- [INFERENCE PARAMETERS] ---
      # Generation Search Breadth (Higher = more accurate, lower = faster)
      - ASR_BEAM_SIZE=5
      # Parallel segment batching (1 is recommended for single-GPU/NPU stability)
      - ASR_BATCH_SIZE=1

      # --- [PREPROCESSING (UVR / MDX-NET)] ---
      # Target Device: AUTO (recommended), CPU, CUDA (NVIDIA), AMD (ROCm), GPU (Intel), NPU (Intel)
      - ASR_PREPROCESS_DEVICE=${ASR_PREPROCESS_DEVICE:-AUTO}
      # Isolation Model Filename
      - VOCAL_SEPARATION_MODEL=UVR-MDX-NET-Inst_HQ_3.onnx
      # Vocal Separation Logic Toggles
      #
      # Off by default, and configurable rather than hardcoded -- a bare `true` here
      # silently overrode both config.py's default and any value the operator exported.
      #
      # Measured on an RTX 5090, same clips, same engine, only this flag changing (two
      # runs each, byte-identical, so the deltas are not noise):
      #
      #                            off        on
      #   clean speech overlap     0.9469     0.9469     no gain at all
      #   harder tail languages    0.7994     0.7826     loses 1.7 points
      #   window misses /118       54         55
      #   hallucinated quiet /25   12         10         its one real win
      #   long-form RTF            0.063      0.110      76% slower
      #
      # So it costs 76% more compute to remove two hallucinated windows in twenty-five,
      # while doing nothing for clean speech and slightly hurting harder audio. And for
      # that one win there is a better lever: WHISPERX scores 0/25 on the same metric and
      # is 2.2x faster than FASTER-WHISPER (see the engine comparison in
      # docs/REMOTE_VALIDATION.md).
      #
      # Worth turning on for music-heavy source material, where there is genuinely
      # non-speech content to strip -- which is not what the test corpus represents.
      - ENABLE_VOCAL_SEPARATION=${ENABLE_VOCAL_SEPARATION:-false}
      - ENABLE_LD_PREPROCESSING=true
      # Coalesce identical concurrent /detect-language requests (same local_path).
      - ENABLE_LD_REQUEST_COALESCING=true
      - SMART_SAMPLING_SEARCH=false

      # --- [RESOURCE ALLOCATION] ---
      # Global core limit for the entire service (Default: 4)
      - CPU_CORE_LIMIT=4
      # Core limit per Whisper ASR task (Auto-capped by CPU_CORE_LIMIT)
      - ASR_THREADS=4
      # Core limit per Preprocessing task (Auto-capped by CPU_CORE_LIMIT)
      - ASR_PREPROCESS_THREADS=4
      # Core limit for Media Normalization (0 = auto-detect system-wide)
      - FFMPEG_THREADS=4
      # Aggressive RAM/VRAM offloading (Default: false)
      - AGGRESSIVE_OFFLOAD=false
      # Idle timeout before unloading models (Default: 300 seconds)
      - MODEL_IDLE_TIMEOUT=300
      # --- [ACCELERATOR ORCHESTRATION] ---
      # Control how many physical hardware units are utilized. 
      # Default: 1 (Safest for multi-service environments). Set to 'ALL' to use everything.
      - MAX_CUDA_UNITS=${MAX_CUDA_UNITS:-1}
      - MAX_GPU_UNITS=${MAX_GPU_UNITS:-1}
      # - MAX_NPU_UNITS=1
      # - MAX_AMD_UNITS=1
      # - MAX_CPU_UNITS=1

      # --- [MEDIA PROCESSING] ---
      # Hardware Acceleration: none (CPU), cuda (NVIDIA), vaapi, qsv (Intel)
      - FFMPEG_HWACCEL=${FFMPEG_HWACCEL:-qsv}
      # Normalization: dynaudnorm (Standard), loudnorm (Broadcast Quality)
      - FFMPEG_FILTER=dynaudnorm

      # --- [SSD WRITE PROTECTION] ---
      # Redirect all transient processing files (uploads, FFmpeg output,
      # UVR stems) to RAM-backed storage. Eliminates SSD write wear.
      - WHISPER_TEMP_DIR=/tmp/whisper
      # --- [KERNEL / JIT CACHES] ---
      # Every compiled-kernel cache must land inside ./model_cache, which is the one
      # bind-mounted, persistent directory. A kernel cache left on the container
      # filesystem is silently rebuilt on every recreate, and that is not a small cost:
      # measured on an Intel Arc iGPU, the first transcription after a cold SYCL cache
      # took 535s against 11s warm -- a 50x difference, entirely one-time JIT.
      #
      # XDG_CACHE_HOME relocates ~/.cache wholesale, which is where Intel's
      # neo_compiler_cache (Level Zero / OpenCL) and ze_intel_npu_cache land, along with
      # torch's own caches. The rest do not follow XDG and need naming individually.
      - XDG_CACHE_HOME=/app/model_cache/kernel_cache/xdg
      # SYCL only writes a persistent on-disk cache when explicitly told to; without this
      # it recompiles per process no matter where the directory points.
      - SYCL_CACHE_PERSISTENT=1
      - SYCL_CACHE_DIR=/app/model_cache/kernel_cache/sycl
      # Intel compute-runtime, for driver versions that read this instead of XDG.
      - NEO_CACHE_DIR=/app/model_cache/kernel_cache/neo
      - cl_cache_dir=/app/model_cache/kernel_cache/neo
      # NVIDIA PTX JIT, for a driver newer than the CUDA the wheels were built against.
      - CUDA_CACHE_PATH=/app/model_cache/kernel_cache/cuda
      - TRITON_CACHE_DIR=/app/model_cache/kernel_cache/triton
      # numba/librosa JIT. Previously /tmp/numba-cache on tmpfs for SSD write protection,
      # but a JIT cache is written once and read forever -- keeping it on a RAM disk paid
      # the compile cost again on every restart to avoid a few MB of writes.
      - NUMBA_CACHE_DIR=/app/model_cache/kernel_cache/numba
      # Minimum free space (MB) in TEMP_DIR before falling back to disk.
      # Default: 2048 MB.  The service also applies a 1.5× headroom
      # multiplier on top of the estimated WAV size.  For very long
      # movies (15h+) the estimated WAV alone exceeds 2 GB, so the
      # service will automatically fall back to persistent (SSD) storage
      # — no ENOSPC crash will occur.
      # - WHISPER_TEMP_MIN_FREE_MB=2048

    # RAM-backed temp storage for transient processing files (SSD protection).
    # Explicit mode survives `docker compose restart`, which remounts tmpfs and
    # otherwise hides the image-layer chmod from the non-root service user.
    # 2G is sufficient for most movies (≤4h). Longer files automatically fall
    # back to SSD-backed persistent storage when tmpfs runs low.
    tmpfs:
      - /tmp/whisper:size=2G,mode=1777

    volumes:
      # Persistent cache for AI models and pre-compiled hardware binaries (NPU)
      - ./model_cache:/app/model_cache
      # Persistent storage for task history, telemetry, and system logs
      - ./data:/app/data
      # Recommended: Mirror your Bazarr media mappings here for instant (0-copy) local processing
      # If paths match, Whisper Pro reads files directly instead of requiring uploads.
      # - /mnt/nas/media:/media
      # - /tv:/tv
      # - /movies:/movies
